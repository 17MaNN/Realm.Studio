<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" aria-labelledby="strata-title">
  <title id="strata-title">Strata Journal Architecture Platform</title>
  <rect width="800" height="500" fill="#E2E8ED"/>
  
  <!-- Frame -->
  <rect x="30" y="30" width="740" height="440" rx="10" fill="#FFFFFF" stroke="#CCD5DC" stroke-width="2"/>
  
  <!-- Editorial columns layout -->
  <rect x="60" y="60" width="180" height="16" rx="3" fill="#12202B"/>
  <rect x="600" y="62" width="140" height="12" rx="3" fill="#4A5B68"/>
  <line x1="60" y1="95" x2="740" y2="95" stroke="#12202B" stroke-width="2"/>
  
  <!-- Main architectural photo placeholder -->
  <rect x="60" y="120" width="420" height="260" rx="6" fill="#1E293B"/>
  <!-- Minimal geometric building silhouette -->
  <polygon points="100,340 180,180 260,340" fill="#334155"/>
  <polygon points="220,340 320,150 420,340" fill="#475569"/>
  <rect x="80" y="140" width="60" height="20" rx="4" fill="#FFD23F"/>
  <text x="110" y="154" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#12202B" text-anchor="middle">ISSUE 04</text>

  <!-- Editorial article column -->
  <rect x="510" y="120" width="230" height="24" rx="4" fill="#12202B"/>
  <rect x="510" y="155" width="180" height="24" rx="4" fill="#12202B"/>
  <rect x="510" y="195" width="230" height="8" rx="2" fill="#64748B"/>
  <rect x="510" y="212" width="220" height="8" rx="2" fill="#64748B"/>
  <rect x="510" y="229" width="210" height="8" rx="2" fill="#64748B"/>
  <rect x="510" y="246" width="230" height="8" rx="2" fill="#64748B"/>
  <rect x="510" y="263" width="170" height="8" rx="2" fill="#64748B"/>

  <!-- Link pill -->
  <rect x="510" y="300" width="130" height="32" rx="16" fill="#12202B"/>

  <!-- Bottom strip -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="420" width="100" height="12" rx="3" fill="#64748B"/>
  <rect x="300" y="420" width="160" height="12" rx="3" fill="#64748B"/>
  <rect x="620" y="420" width="120" height="12" rx="3" fill="#1F4FFF"/>
</svg>
