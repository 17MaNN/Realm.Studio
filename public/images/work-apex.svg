<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" aria-labelledby="apex-title">
  <title id="apex-title">Apex Capital Platform Mockup</title>
  <rect width="800" height="500" fill="#E2E8ED"/>
  
  <!-- Frame -->
  <rect x="30" y="30" width="740" height="440" rx="10" fill="#FFFFFF" stroke="#CCD5DC" stroke-width="2"/>
  
  <!-- Header line -->
  <rect x="60" y="60" width="120" height="18" rx="3" fill="#12202B"/>
  <rect x="520" y="65" width="60" height="8" rx="2" fill="#4A5B68"/>
  <rect x="600" y="65" width="60" height="8" rx="2" fill="#4A5B68"/>
  <rect x="680" y="60" width="60" height="20" rx="10" fill="#12202B"/>
  <line x1="60" y1="100" x2="740" y2="100" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Big editorial statement -->
  <rect x="60" y="130" width="480" height="34" rx="4" fill="#12202B"/>
  <rect x="60" y="175" width="360" height="34" rx="4" fill="#12202B"/>
  <rect x="60" y="225" width="420" height="12" rx="3" fill="#64748B"/>
  <rect x="60" y="245" width="340" height="12" rx="3" fill="#64748B"/>
  
  <rect x="60" y="280" width="140" height="36" rx="18" fill="#1F4FFF"/>

  <!-- Structured portfolio data table -->
  <rect x="490" y="130" width="250" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="510" y="150" width="90" height="12" rx="3" fill="#12202B"/>
  <rect x="670" y="150" width="50" height="12" rx="3" fill="#1F4FFF"/>
  <line x1="510" y1="175" x2="720" y2="175" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="510" y="195" width="110" height="10" rx="2" fill="#334155"/>
  <rect x="650" y="195" width="70" height="10" rx="2" fill="#059669"/>
  <line x1="510" y1="220" x2="720" y2="220" stroke="#F1F5F9" stroke-width="1"/>

  <rect x="510" y="240" width="100" height="10" rx="2" fill="#334155"/>
  <rect x="650" y="240" width="70" height="10" rx="2" fill="#059669"/>
  <line x1="510" y1="265" x2="720" y2="265" stroke="#F1F5F9" stroke-width="1"/>

  <rect x="510" y="285" width="120" height="10" rx="2" fill="#334155"/>
  <rect x="650" y="285" width="70" height="10" rx="2" fill="#059669"/>
  <line x1="510" y1="310" x2="720" y2="310" stroke="#F1F5F9" stroke-width="1"/>

  <rect x="510" y="330" width="95" height="10" rx="2" fill="#334155"/>
  <rect x="650" y="330" width="70" height="10" rx="2" fill="#059669"/>

  <!-- Footer highlight bar -->
  <rect x="60" y="380" width="380" height="50" rx="8" fill="#FFD23F"/>
  <rect x="80" y="398" width="180" height="14" rx="3" fill="#12202B"/>
</svg>
