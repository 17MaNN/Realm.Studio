<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" aria-labelledby="lumina-title">
  <title id="lumina-title">Lumina Analytics Dashboard</title>
  <rect width="800" height="500" fill="#E2E8ED"/>
  
  <!-- Browser window frame -->
  <rect x="30" y="30" width="740" height="440" rx="10" fill="#FFFFFF" stroke="#CCD5DC" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="40" rx="10" fill="#F1F4F7"/>
  <circle cx="56" cy="50" r="5" fill="#E57373"/>
  <circle cx="74" cy="50" r="5" fill="#FFD54F"/>
  <circle cx="92" cy="50" r="5" fill="#81C784"/>
  <rect x="120" y="42" width="240" height="16" rx="8" fill="#E2E8ED"/>
  
  <!-- Sidebar -->
  <rect x="30" y="70" width="160" height="400" fill="#F8FAFB"/>
  <rect x="50" y="100" width="100" height="12" rx="4" fill="#12202B"/>
  <rect x="50" y="130" width="120" height="10" rx="4" fill="#CBD5E1"/>
  <rect x="50" y="155" width="105" height="10" rx="4" fill="#CBD5E1"/>
  <rect x="50" y="180" width="115" height="10" rx="4" fill="#1F4FFF"/>
  <rect x="50" y="205" width="90" height="10" rx="4" fill="#CBD5E1"/>
  
  <!-- Main dashboard content -->
  <rect x="220" y="100" width="150" height="16" rx="4" fill="#12202B"/>
  <rect x="220" y="125" width="240" height="10" rx="3" fill="#94A3B8"/>
  
  <!-- Metric cards -->
  <rect x="220" y="155" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="235" y="170" width="70" height="8" rx="2" fill="#94A3B8"/>
  <rect x="235" y="190" width="90" height="18" rx="3" fill="#12202B"/>
  <rect x="235" y="214" width="45" height="4" rx="2" fill="#1F4FFF"/>
  
  <rect x="395" y="155" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="410" y="170" width="80" height="8" rx="2" fill="#94A3B8"/>
  <rect x="410" y="190" width="105" height="18" rx="3" fill="#12202B"/>
  <rect x="410" y="214" width="55" height="4" rx="2" fill="#FFD23F"/>

  <rect x="570" y="155" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="585" y="170" width="75" height="8" rx="2" fill="#94A3B8"/>
  <rect x="585" y="190" width="85" height="18" rx="3" fill="#12202B"/>
  <rect x="585" y="214" width="60" height="4" rx="2" fill="#1F4FFF"/>

  <!-- Chart frame -->
  <rect x="220" y="245" width="510" height="190" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="240" y="265" width="130" height="12" rx="3" fill="#12202B"/>
  
  <!-- Bar chart visual -->
  <rect x="250" y="380" width="35" height="40" rx="3" fill="#CBD5E1"/>
  <rect x="305" y="340" width="35" height="80" rx="3" fill="#CBD5E1"/>
  <rect x="360" y="320" width="35" height="100" rx="3" fill="#1F4FFF"/>
  <rect x="415" y="350" width="35" height="70" rx="3" fill="#CBD5E1"/>
  <rect x="470" y="300" width="35" height="120" rx="3" fill="#12202B"/>
  <rect x="525" y="330" width="35" height="90" rx="3" fill="#CBD5E1"/>
  <rect x="580" y="290" width="35" height="130" rx="3" fill="#FFD23F"/>
  <rect x="635" y="315" width="35" height="105" rx="3" fill="#1F4FFF"/>
</svg>
