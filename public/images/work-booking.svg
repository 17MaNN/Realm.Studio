  <rect x="95" y="355" width="110" height="14" rx="3" fill="#FFD23F"/>
  <rect x="95" y="380" width="90" height="10" rx="2" fill="#E2E8F0"/>

  <rect x="245" y="335" width="150" height="85" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="265" y="355" width="110" height="14" rx="3" fill="#38BDF8"/>
  <rect x="265" y="380" width="90" height="10" rx="2" fill="#E2E8F0"/>

