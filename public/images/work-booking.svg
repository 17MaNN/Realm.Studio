  <rect x="75" y="165" width="65" height="65" rx="32.5" fill="#12202B"/>
  <rect x="85" y="190" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="160" y="165" width="65" height="65" rx="32.5" fill="#059669"/>
  <rect x="170" y="190" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="245" y="165" width="65" height="65" rx="32.5" fill="#1F4FFF"/>
  <rect x="255" y="190" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="330" y="165" width="65" height="65" rx="8" fill="#12202B"/>
  <rect x="340" y="190" width="45" height="12" rx="3" fill="#FFD23F"/>

  <!-- Table Row 2 -->
  <rect x="75" y="250" width="65" height="65" rx="32.5" fill="#059669"/>
  <rect x="85" y="275" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="160" y="250" width="65" height="65" rx="32.5" fill="#12202B"/>
  <rect x="170" y="275" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="245" y="250" width="65" height="65" rx="32.5" fill="#12202B"/>
  <rect x="255" y="275" width="45" height="12" rx="3" fill="#FFFFFF"/>

  <rect x="330" y="250" width="65" height="65" rx="8" fill="#059669"/>
  <rect x="340" y="275" width="45" height="12" rx="3" fill="#FFFFFF"/>

