  <rect x="475" y="297" width="110" height="12" rx="3" fill="#12202B"/>
  <rect x="475" y="315" width="65" height="8" rx="2" fill="#64748B"/>
  <rect x="660" y="295" width="60" height="18" rx="9" fill="#FEF3C7"/>

  <!-- Reservation 4 -->
  <rect x="460" y="345" width="270" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="475" y="357" width="90" height="12" rx="3" fill="#12202B"/>
  <rect x="475" y="375" width="75" height="8" rx="2" fill="#64748B"/>
  <rect x="660" y="355" width="60" height="18" rx="9" fill="#ECFDF5"/>

  <!-- Quick Action Dispatch Bar -->
  <rect x="460" y="405" width="270" height="28" rx="14" fill="#12202B"/>
