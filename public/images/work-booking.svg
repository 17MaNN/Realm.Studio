<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" aria-labelledby="booking-title">
  <title id="booking-title">Hakkasan Booking Management System</title>
  <rect width="800" height="500" fill="#E8EDF2"/>
  
  <!-- Outer dashboard frame -->
  <rect x="25" y="25" width="750" height="450" rx="12" fill="#FFFFFF" stroke="#CCD5DE" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="25" y="25" width="750" height="55" rx="12" fill="#12202B"/>
  <rect x="55" y="44" width="180" height="16" rx="3" fill="#EAF9FF"/>
  <rect x="420" y="44" width="70" height="20" rx="10" fill="#243C4F"/>
  <rect x="500" y="44" width="80" height="20" rx="10" fill="#059669"/>
  <rect x="590" y="44" width="70" height="20" rx="10" fill="#1F4FFF"/>
  <rect x="670" y="40" width="85" height="26" rx="13" fill="#FFD23F"/>

  <!-- Left: Live Table Floor Plan -->
