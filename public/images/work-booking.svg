  <rect x="460" y="125" width="160" height="14" rx="3" fill="#12202B"/>
  <line x1="460" y1="150" x2="730" y2="150" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Reservation 1 -->
  <rect x="460" y="165" width="270" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="475" y="177" width="100" height="12" rx="3" fill="#12202B"/>
  <rect x="475" y="195" width="60" height="8" rx="2" fill="#64748B"/>
  <rect x="660" y="175" width="60" height="18" rx="9" fill="#ECFDF5"/>

  <!-- Reservation 2 -->
